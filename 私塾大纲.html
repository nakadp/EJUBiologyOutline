<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --primary-glow: rgba(56, 189, 248, 0.5);
            --secondary-glow: rgba(167, 139, 250, 0.5);
            --accent-green: #34d399;
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* Resizer variables */
            --left-ratio: 50%;
            --left-ratio-num: 50;
            --scale-factor: calc(var(--left-ratio-num) / 50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(167, 139, 250, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        /* Ambient animated blobs */
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(56, 189, 248, 0.15);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: rgba(167, 139, 250, 0.15);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        header {
            text-align: left;
            padding: 4rem 2rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #38bdf8, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            animation: fade-in-up 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header p {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 800px;
            animation: fade-in-up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        /* Container Layout */
        .page-container {
            position: relative;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 0 6rem;
        }

        /* The draggable boundary */
        .resizer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: var(--left-ratio);
            width: 16px;
            transform: translateX(-50%);
            cursor: col-resize;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .resizer::after {
            content: '';
            width: 2px;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.2s, width 0.2s, box-shadow 0.2s;
        }

        .resizer:hover::after, .resizer.dragging::after {
            background: var(--accent-blue);
            width: 4px;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        /* Row Layout */
        .lesson-row {
            display: flex;
            width: 100%;
            margin-bottom: 3rem;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .lesson-row.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lesson-text-col {
            width: var(--left-ratio);
            padding-left: 1rem;
            padding-right: 3rem; /* Space near the resizer */
            position: relative;
        }

        .lesson-image-col {
            width: calc(100% - var(--left-ratio));
            padding-left: 3rem; /* Space near the resizer */
            padding-right: 2rem;
            display: flex;
            align-items: flex-start;
        }

        /* Image Display */
        .lesson-image-col img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }
        
        .lesson-image-col img:hover {
            transform: scale(1.02);
        }

        .empty-image-placeholder {
            width: 100%;
            padding: 3rem;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: calc(1.1rem * var(--scale-factor));
            background: rgba(0, 0, 0, 0.1);
        }

        /* Timeline Graphics */
        .timeline-line {
            position: absolute;
            left: 2.75rem;
            top: 2rem;
            bottom: -3rem;
            width: 2px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0.1));
            z-index: 0;
        }

        .lesson-row:last-child .timeline-line {
            bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
        }

        .timeline-dot {
            position: absolute;
            left: 2.75rem;
            top: 2.5rem;
            width: calc(14px * var(--scale-factor));
            height: calc(14px * var(--scale-factor));
            border-radius: 50%;
            transform: translateX(-50%);
            background: var(--accent-blue);
            box-shadow: 0 0 15px var(--accent-blue);
            border: 2px solid var(--bg-color);
            z-index: 1;
            transition: all 0.3s ease;
        }

        .lesson-row:nth-child(3n+2) .timeline-dot {
            background: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-purple);
        }

        .lesson-row:nth-child(3n+3) .timeline-dot {
            background: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
        }

        /* Glassmorphism Content */
        .timeline-content {
            margin-left: 5rem; /* Space from dot */
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: calc(2.5rem * var(--scale-factor));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .lesson-row:hover .timeline-content {
            transform: translateX(8px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .lesson-row:hover .timeline-content::before {
            opacity: 1;
        }

        /* Typography Scaling via var(--scale-factor) */
        .lesson-number {
            display: inline-block;
            font-size: calc(0.85rem * var(--scale-factor));
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: calc(0.4rem * var(--scale-factor)) calc(1rem * var(--scale-factor));
            border-radius: 30px;
            margin-bottom: calc(1.2rem * var(--scale-factor));
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .lesson-row:nth-child(3n+2) .lesson-number {
            background: rgba(192, 132, 252, 0.1);
            color: var(--accent-purple);
            border-color: rgba(192, 132, 252, 0.2);
        }

        .lesson-row:nth-child(3n+3) .lesson-number {
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-green);
            border-color: rgba(52, 211, 153, 0.2);
        }

        .lesson-title {
            font-size: calc(1.75rem * var(--scale-factor));
            font-weight: 700;
            margin-bottom: calc(0.75rem * var(--scale-factor));
            color: #fff;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .lesson-core {
            font-size: calc(1.1rem * var(--scale-factor));
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: calc(1.5rem * var(--scale-factor));
            font-weight: 500;
            line-height: 1.6;
        }

        /* Detailed points */
        .details-wrapper {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: calc(1.5rem * var(--scale-factor));
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: calc(1.5rem * var(--scale-factor));
        }

        .details-list {
            list-style: none;
        }

        .details-list li {
            position: relative;
            font-size: calc(0.95rem * var(--scale-factor));
            color: #cbd5e1;
            margin-bottom: calc(0.8rem * var(--scale-factor));
            line-height: 1.6;
            padding-left: calc(1.5rem * var(--scale-factor));
        }

        .details-list li:last-child {
            margin-bottom: 0;
        }

        .details-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: calc(0.6rem * var(--scale-factor));
            width: calc(6px * var(--scale-factor));
            height: calc(6px * var(--scale-factor));
            background: var(--accent-blue);
            border-radius: 50%;
            opacity: 0.8;
        }

        .lesson-row:nth-child(3n+2) .details-list li::before { background: var(--accent-purple); }
        .lesson-row:nth-child(3n+3) .details-list li::before { background: var(--accent-green); }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Touch devices or small screens fallback */
        @media (max-width: 768px) {
            .resizer { display: none; }
            :root { --left-ratio: 100% !important; --left-ratio-num: 50 !important; }
            .lesson-row { flex-direction: column; }
            .lesson-text-col { padding-right: 1rem; margin-bottom: 2rem; }
            .lesson-image-col { width: 100%; padding-left: 1rem; }
            .timeline-content { margin-left: 3rem; padding: 1.5rem; }
            .timeline-line { left: 1.5rem; }
            .timeline-dot { left: 1.5rem; }
        }
    </style>
</head>

            const row = document.createElement('div');
            row.className = 'lesson-row';
            row.style.transitionDelay = `${(index % 5) * 0.1}s`;

            const detailsList = lesson.details.map(d => `<li>${d}</li>`).join('');
            
            // Image handling
            let imageContent = '';
            if (lesson.mapImage) {
                imageContent = `<img src="${lesson.mapImage}" alt="第 ${lesson.lesson} 讲 配图" />`;
            } else {
                imageContent = `<div class="empty-image-placeholder">配图尚未添加</div>`;
            }

            row.innerHTML = `
                <div class="lesson-text-col">
                    <div class="timeline-line"></div>
                    <div class="timeline-dot"></div>
                    <div class="timeline-content">
                        <div class="lesson-number">第 ${lesson.lesson} 讲</div>
                        <h2 class="lesson-title">${lesson.title}</h2>
                        <p class="lesson-core">${lesson.core}</p>
                        
                        <div class="details-wrapper">
                            <ul class="details-list">
                                ${detailsList}
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="lesson-image-col">
                    ${imageContent}
                </div>
            `;
            container.appendChild(row);
        });

        // Intersection Observer for scroll animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        });

        setTimeout(() => {
            document.querySelectorAll('.lesson-row').forEach(row => {
                observer.observe(row);
            });
        }, 50);

        // Resizer Logic
        const resizer = document.getElementById('resizer');
        let isDragging = false;

        resizer.addEventListener('mousedown', (e) => {
            isDragging = true;
            resizer.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; // Prevent text selection while dragging
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const container = document.getElementById('page-container');
            const rect = container.getBoundingClientRect();
            
            // Calculate percentage based on the container's width and position
            let newRatio = ((e.clientX - rect.left) / rect.width) * 100;
            
            // Constrain between 20% and 80% to ensure both sides are visible
            if (newRatio < 20) newRatio = 20;
            if (newRatio > 80) newRatio = 80;
            
            document.documentElement.style.setProperty('--left-ratio', `${newRatio}%`);
            // Pass pure number for CSS calc() math scaling
            document.documentElement.style.setProperty('--left-ratio-num', newRatio);
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resizer.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });
    </script>
</body>

</html>
